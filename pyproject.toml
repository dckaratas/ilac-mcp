[project]
name = "ilac-mcp"
version = "0.1.0"
description = "Türkiye'de ruhsatlı ilaçlar için TİTCK verisi sunan MCP sunucusu: arama, eşdeğer ilaç, ruhsat ve e-reçete durumu"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "dckaratas", email = "karatas.can.dogan@gmail.com" }
]
keywords = ["mcp", "titck", "ilac", "turkey", "drug", "pharmacy", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Natural Language :: Turkish",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.16",
    "mcp>=2.3,<3",
    "openpyxl>=3.1.5",
    "platformdirs>=4.13.5",
]

[project.scripts]
ilac-mcp = "ilac_mcp:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
